<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiyasha | MyPortfolio</title>
  <style>
      * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

  body {
      background: radial-gradient(circle at bottom left, #00d2ff, #3a47d5);
      background-attachment: fixed;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 25, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 0;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: rgb(126, 223, 240);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    nav ul li a:hover {
      background: rgb(126, 223, 240);
      color: black;
    }
  </style>
</head>

<body>
  <!-- Header with sticky navbar -->
  <header>
    <div class="nav-container">
      <h1 class="logo">Tiya<span>sha</span></h1>
      <nav>
        <ul>
          <li><a href= #home data-i18n="home"> Home</a></li>
          <li><a href= #about data-i18n="about"> About</a></li>
          <li><a href= #projects data-i18n="projects"> Projects</a></li>
          <li><a href= #contact data-i18n="contact"> Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
</body>
</html>
